<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: rounded square, warm paper tone, matching color-bg-alt -->
  <rect x="2" y="2" width="60" height="60" rx="14"
        fill="#f1ebe1" stroke="#ddd2c2" stroke-width="2"/>

  <!-- Lowercase "e" — echoes the "emmacza." wordmark in the site header,
       set in a serif face to match font-display (Georgia) -->
  <text x="24" y="46"
        font-family="DejaVu Serif"
        font-size="40"
        font-weight="700"
        fill="#2c2730"
        text-anchor="middle">e</text>

  <!-- The accent dot, same dusty purple as color-accent, echoing the
       "." after the wordmark on every page -->
  <circle cx="47" cy="47" r="5.5" fill="#7d6a94"/>
</svg>
